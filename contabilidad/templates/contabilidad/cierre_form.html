<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Cierre de Caja - GC-FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style> body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; } </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-[#2a4365] text-white px-6 py-3 flex justify-between items-center shadow-md relative z-20">
        <div class="flex items-center space-x-2">
            <i data-lucide="boxes" class="w-6 h-6"></i>
            <span class="font-bold text-xl tracking-widest">GC-FL</span>
        </div>
        
        <!-- Ocultamos la búsqueda superior porque ya tenemos una en el panel -->
        <div class="hidden md:flex flex-1 max-w-xl mx-4"></div>

        <div class="relative">
            <button onclick="toggleDropdown()" class="flex items-center space-x-2 hover:text-gray-200 focus:outline-none transition-colors">
                <span class="font-medium text-transform: uppercase">{{ user.username }}</span>
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </button>
            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 border border-gray-100">
                <a href="#" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition-colors">
                    <i data-lucide="user" class="w-4 h-4 mr-2"></i> Perfil
                </a>
                <a href="{% url 'logout' %}" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4 mr-2"></i> Salir
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-8 max-w-2xl mx-auto w-full">

        <div class="mb-6 border-b border-gray-300 pb-2 flex justify-between items-end">
            <h1 class="text-2xl font-bold text-gray-800">Cierre de Caja</h1>
            <a href="{% url 'contabilidad:dashboard_contabilidad' %}" class="text-sm text-blue-600 hover:underline">Volver a Contabilidad</a>
        </div>

        <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden mt-6">
            <div class="bg-teal-600 px-6 py-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="calculator" class="w-5 h-5"></i> Declaración de Caja Diaria
                </h2>
            </div>
            
            <form method="POST" action="" class="p-8 space-y-6">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-wide">Sucursal a cerrar caja</label>
                    <select name="sucursal" required class="w-full border border-gray-300 rounded-lg py-3 px-4 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 bg-gray-50 text-lg font-semibold text-[#2a4365]">
                        <option value="" disabled selected>-- Seleccionar Sucursal --</option>
                        {% for s in sucursales %}
                            <option value="{{ s.id }}">{{ s.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="border-t border-gray-200 pt-6">
                    <label class="block text-sm font-bold text-gray-700 mb-4 uppercase tracking-wide">Arqueo de Billetes Físicos</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Efectivo Usado (Gastos)</label>
                            <input type="number" step="0.01" name="efectivo_usado" value="0.00" min="0" required class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-2 focus:ring-teal-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Efectivo en Mano</label>
                            <input type="number" step="0.01" name="efectivo_declarado" value="0.00" min="0" required class="w-full border border-green-400 bg-green-50 rounded-md py-2 px-3 focus:ring-2 focus:ring-green-500 text-green-800 font-bold text-lg">
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-200 pt-6">
                    <label class="block text-xs font-semibold text-gray-500 mb-2 uppercase">Observaciones</label>
                    <textarea name="observaciones" rows="2" class="w-full border border-gray-300 rounded-md py-2 px-3 focus:ring-2 focus:ring-teal-500" placeholder="Ej: Faltan $100 de un vuelto..."></textarea>
                </div>
                
                <button type="submit" class="w-full bg-[#2a4365] hover:bg-[#1e324b] text-white font-bold py-4 px-6 rounded-lg transition-colors flex justify-center items-center gap-2 mt-4 text-lg">
                    <i data-lucide="check-circle" class="w-6 h-6"></i> Confirmar Cierre y Generar Ticket
                </button>
            </form>
        </div>
    </main>
    <script> lucide.createIcons(); </script>
</body>
</html>
