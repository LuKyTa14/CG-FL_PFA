<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización Exitosa - GC-FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-xl shadow-xl overflow-hidden border border-gray-200">
        
        <div class="bg-[#2a4365] py-5 text-center">
            <h1 class="text-white text-2xl font-bold tracking-widest">GC-FL</h1>
        </div>

        <div class="p-8 space-y-6 text-center">
            
            <div class="flex justify-center">
                <!-- Icono de éxito -->
                <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>

            <div class="space-y-2">
                <h2 class="text-lg font-bold text-gray-800">¡Contraseña Guardada!</h2>
                <p class="text-sm text-gray-500 font-medium leading-relaxed">
                    Tu acceso ha sido restablecido de forma segura. Ya podés volver a operar.
                </p>
            </div>

            <div class="pt-4">
                <a href="{% url 'login' %}" 
                    class="block w-full bg-[#2a4365] hover:bg-[#1e324b] text-white font-semibold py-3 px-4 rounded-md transition-colors shadow-md hover:shadow-lg">
                    INICIAR SESIÓN
                </a>
            </div>
        </div>
    </div>

</body>
</html>
