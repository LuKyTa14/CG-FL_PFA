<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado - GC-FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-xl shadow-xl overflow-hidden border border-gray-200">
        
        <div class="bg-[#2a4365] py-5 text-center">
            <h1 class="text-white text-2xl font-bold tracking-widest">GC-FL</h1>
        </div>

        <div class="p-8 space-y-6 text-center">
            
            <div class="flex justify-center">
                <!-- Icono de correo enviado -->
                <svg class="w-16 h-16 text-[#2a4365]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            </div>

            <div class="space-y-2">
                <h2 class="text-lg font-bold text-gray-800">Revisá tu bandeja</h2>
                <p class="text-sm text-gray-500 font-medium leading-relaxed">
                    Te hemos enviado un correo con las instrucciones. Si no lo ves, verificá la carpeta de Spam.
                </p>
            </div>

            <div class="pt-4">
                <a href="{% url 'login' %}" 
                    class="block w-full border-2 border-gray-200 hover:border-[#2a4365] hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-md transition-colors">
                    VOLVER AL INICIO
                </a>
            </div>
        </div>
    </div>

</body>
</html>
