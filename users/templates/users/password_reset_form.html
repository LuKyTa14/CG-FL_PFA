<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - GC-FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-xl shadow-xl overflow-hidden border border-gray-200">
        
        <div class="bg-[#2a4365] py-5 text-center">
            <h1 class="text-white text-2xl font-bold tracking-widest">GC-FL</h1>
        </div>

        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}

            <div class="text-center space-y-2">
                <h2 class="text-lg font-bold text-gray-800">Recuperar Acceso</h2>
                <p class="text-sm text-gray-500 font-medium">Ingresá tu correo y te enviaremos un enlace</p>
            </div>
            
            <div>
                <input 
                    type="email" 
                    name="email"
                    placeholder="CORREO ELECTRÓNICO" 
                    class="w-full border-2 border-gray-200 rounded-md py-3 px-4 text-center text-gray-700 tracking-wide focus:outline-none focus:border-[#2a4365] focus:ring-1 focus:ring-[#2a4365] transition-colors placeholder-gray-400 font-medium"
                    required
                >
            </div>

            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-[#2a4365] hover:bg-[#1e324b] text-white font-semibold py-3 px-4 rounded-md transition-colors shadow-md hover:shadow-lg">
                    ENVIAR ENLACE
                </button>
            </div>
            
            <div class="flex items-center justify-center mt-2">
                <a href="{% url 'login' %}" class="text-sm font-medium text-gray-500 hover:text-[#2a4365] transition-colors">
                    Volver al inicio de sesión
                </a>
            </div>
        </form>
    </div>

</body>
</html>
