<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login GC-FL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-xl shadow-xl overflow-hidden border border-gray-200">
        
        <div class="bg-[#2a4365] py-5 text-center">
            <h1 class="text-white text-2xl font-bold tracking-widest">GC-FL</h1>
        </div>

        <!-- method="POST" para enviar la info de forma segura -->
        <form method="POST" class="p-8 space-y-6">
            
            <!-- Token de seguridad obligatorio de Django -->
            {% csrf_token %}

            <!-- Bloque para mostrar mensajes de error de views.py -->
            {% if messages %}
                {% for message in messages %}
                    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded relative text-sm text-center" role="alert">
                        <span class="block sm:inline">{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
            
            <div>
                <input 
                    type="text" 
                    name="username"
                    placeholder="USER" 
                    class="w-full border-2 border-gray-200 rounded-md py-3 px-4 text-center text-gray-700 tracking-wide focus:outline-none focus:border-[#2a4365] focus:ring-1 focus:ring-[#2a4365] transition-colors placeholder-gray-400 font-medium"
                    required
                >
            </div>

            <div>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="PASSWORD" 
                    class="w-full border-2 border-gray-200 rounded-md py-3 px-4 text-center text-gray-700 tracking-wide focus:outline-none focus:border-[#2a4365] focus:ring-1 focus:ring-[#2a4365] transition-colors placeholder-gray-400 font-medium"
                    required
                >
            </div>

            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full bg-[#2a4365] hover:bg-[#1e324b] text-white font-semibold py-3 px-4 rounded-md transition-colors shadow-md hover:shadow-lg">
                    INGRESAR
                </button>
            </div>
            
            <div class="text-center mt-4">
                <a href="#" class="text-xs text-gray-400 hover:text-[#2a4365] transition-colors">¿Olvidaste tu contraseña?</a>
            </div>
        </form>
    </div>

</body>
</html>
